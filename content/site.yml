# Your bio. Leave a blank line between paragraphs.
bio: |
  Nguyen Tang was born in Rạch Giá, Vietnam in 1945 and came to America in 1978. At a young age, he learned portrait drawing using black charcoal powder and a few dry brushes. This technique is called "tranh truyền thần bột than", which translates to "charcoal powder portrait drawing". Years of drawing facial expressions taught him how much a single stroke can say. Drawing served as a natural step into his practice in Chinese calligraphy art, for which he won accolades and was invited to teach in Hà Tiên before leaving Vietnam.

  In 1998, twenty years after immigrating to America, he began oil painting. He learned color theory and strengthened his drawing skills by painting every day subjects - still life, nature, animals and landscapes. Today, Nguyen lives in San Jose, California and enjoys spending his time oil painting, learning new techniques, and working on Chinese calligraphy.
