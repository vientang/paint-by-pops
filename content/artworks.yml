# ─────────────────────────────────────────────────────────────
#  ARTWORKS
#
#  - Artworks appear on the home page in this order, so put
#    your newest piece at the top.
#  - To add a piece: copy one block (from the "- id:" line down
#    to the last line of that block), paste it at the top, change
#    the words, and upload the photo(s).
#  - Keep the spacing exactly as shown. Each line inside a block
#    starts with the same number of spaces.
#
#  Fields
#    id           Short web-address name: lowercase letters,
#                 numbers and dashes only. Must be different
#                 for every piece. Example: lake-at-dawn
#    title        Shown as the heading.
#    completed    Optional. Example: October 2026
#    description  A few sentences. Blank line = new paragraph.
#                 For a poem, write "description: |" and put each
#                 line on its own line, indented (see the first piece).
#    photo        File name inside photos/artworks/
#    alt          Optional. Describe the painting in a sentence
#                 for people who use screen readers.
#    background   Optional. Overrides the automatic background
#                 color, for example "#E8E1F0".
#    extras       Optional. Behind-the-scenes / inspiration photos.
#                 Each one has kind, title, description, photo
#                 (file name inside photos/extras/).
# ─────────────────────────────────────────────────────────────

- id: paris-montmartre
  title: "Paris Montmartre"
  completed: "May 2026"
  description: |
    Through streets of stone where echoes sleep
    And golden autumn shadows weep
    Lonely dreamers drift and sigh
    With whispers aimed at the sky
